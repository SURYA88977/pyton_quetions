[`Explain data types and type conversion in Python.`,`<b>Numeric:</b> int, float, complex. <b>Text:</b> str. <b>Sequence:</b> list, tuple, range. <b>Mapping:</b> dict. <b>Set:</b> set, frozenset. <b>Boolean:</b> bool. <b>None:</b> NoneType.<br><b>Implicit conversion:</b> Python promotes automatically (int + float gives float).<br><b>Explicit conversion (casting):</b> <code>int("5")</code>, <code>float(3)</code>, <code>str(10)</code>, <code>list("abc")</code>. Use <code>type()</code> to check.`],

[`Which function gets the next item from an iterator?`,[`go()`,`step()`,`next()`,`fetch()`],2]
];
const SECS=[["Fill in the blanks ("+FIB.length+")","fib"],["Descriptive ("+DESC.length+")","desc"],["MCQs ("+MCQ.length+")","mcq"]];
const out=document.getElementById("out"),tabs=document.getElementById("tabs");
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function item(q,html,opts,ci){
  const li=el("li","q");li.appendChild(el("p","qt",q));
  let ol=null;
  if(opts){ol=el("ol","opts");opts.forEach(o=>ol.appendChild(el("li",null,o)));li.appendChild(ol)}
  const b=el("button","tog","Show answer");b.setAttribute("aria-expanded","false");
  const a=el("div","ans");a.hidden=true;
  if(opts)a.textContent="Answer: "+"ABCD"[ci]+". "+opts[ci];
  else if(html)a.innerHTML=html;
  b.onclick=()=>set(li,a.hidden);
  li._set=v=>{a.hidden=!v;b.textContent=v?"Hide answer":"Show answer";b.setAttribute("aria-expanded",v);if(ol)ol.children[ci].classList.toggle("right",v)};
  li.appendChild(b);li.appendChild(a);return li}
function set(li,v){li._set(v)}
const lists={};
SECS.forEach(([name,id],i)=>{
  const ol=el("ol","list");ol.hidden=true;
  if(id==="fib")FIB.forEach(([q,a])=>{const li=item(q,null);li.lastChild.innerHTML="";li.lastChild.textContent="Answer: "+a;ol.appendChild(li)});
  if(id==="desc")DESC.forEach(([q,a])=>ol.appendChild(item(q,a)));
  if(id==="mcq")MCQ.forEach(([q,o,c])=>ol.appendChild(item(q,null,o,c)));
  out.appendChild(ol);lists[id]=ol;
  const t=el("button","tab",name);t.setAttribute("role","tab");t.onclick=()=>show(id);t.dataset.id=id;tabs.appendChild(t)});
let cur="fib";
function show(id){cur=id;for(const k in lists)lists[k].hidden=k!==id;
  [...tabs.children].forEach(t=>t.setAttribute("aria-selected",t.dataset.id===id));window.scrollTo(0,0)}
document.getElementById("showAll").onclick=()=>[...lists[cur].children].forEach(li=>set(li,true));
document.getElementById("hideAll").onclick=()=>[...lists[cur].children].forEach(li=>set(li,false));
show("fib");
</script>
</body>
